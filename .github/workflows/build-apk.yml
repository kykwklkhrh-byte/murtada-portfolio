name: Android APK
on:
  push:
    branches: [viral-clips-ai-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms android --org com.mortadaa --project-name viral_clips_ai .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Flutter sources
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter widget tests
        working-directory: flutter_app
        run: flutter test
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: ViralClipsAI-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
