name: Manage and publish portfolio
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-content-updates
  cancel-in-progress: false
jobs:
  update-and-publish:
    if: ${{ github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'PORTFOLIO_REQUEST_V1') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get website files
        uses: actions/checkout@v4
      - name: Validate and apply the owner's request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/manage_content.py
      - name: Save changes permanently
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update portfolio content via owner-approved request"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the updated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish the updated website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm request to owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ تم حفظ التعديل ونشره على موقعك: https://kykwklkhrh-byte.github.io/murtada-portfolio/"
          gh issue close "$ISSUE_NUMBER" --reason completed
