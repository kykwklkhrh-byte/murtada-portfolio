name: Secret Vault Android APK
on:
  push:
    branches: [secret-vault-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: secret_vault_app
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract Flutter sources
        working-directory: .
        run: |
          mkdir -p secret_vault_app
          base64 --decode secret-vault-bundle.b64 > /tmp/vault.zip
          unzip -q /tmp/vault.zip -d secret_vault_app
      - name: Generate native Android and distinctive app icon
        run: |
          cp pubspec.yaml /tmp/vault-pubspec.yaml
          cp -r lib /tmp/vault-lib
          flutter create --platforms=android --org com.mortadaa --project-name secret_vault .
          cp /tmp/vault-pubspec.yaml pubspec.yaml
          sed -i 's/version: 2.1.0+4/version: 2.2.0+5/' pubspec.yaml
          cp /tmp/vault-lib/*.dart lib/
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          data = manifest.read_text().replace('android:label="secret_vault"', 'android:label="حاسبتي M"')
          data = data.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          manifest.write_text(data)
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          content = content.replace('applicationId = "com.mortadaa.secret_vault"', 'applicationId = "com.mortadaa.secret_vault_v21"')
          gradle.write_text(content)
          for source in Path('assets/android_icons').glob('mipmap-*/ic_launcher.png'):
              dest = Path('android/app/src/main/res') / source.parent.name / 'ic_launcher.png'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(source.read_bytes())
          print('Custom launcher icon installed in all Android density folders')
          PY
          grep -q 'secret_vault_v21' android/app/build.gradle.kts
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze sources
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Verify Firebase client registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('../firebase-client-config.json').read_text())
          assert config['FIREBASE_PROJECT_ID'] == 'hasibati-m'
          assert config['FIREBASE_SENDER_ID'].isdigit()
          assert config['FIREBASE_APP_ID'].startswith('1:' + config['FIREBASE_SENDER_ID'] + ':android:')
          assert config['FIREBASE_API_KEY'].startswith('AIza')
          gradle = Path('android/app/build.gradle.kts').read_text()
          assert 'com.mortadaa.secret_vault_v21' in gradle
          print('Firebase public configuration and Android app ID verified')
          PY
      - name: Build Firebase-configured APK
        run: flutter build apk --release --dart-define-from-file=../firebase-client-config.json
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasibati-m-v2-2-firebase-apk
          path: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish publicly downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: secret-vault-v2-2-firebase
          target_commitish: secret-vault-v2
          name: "حاسبتي M – v2.2 Firebase"
          body: |
            Custom calculator icon and Android vault storage fix.
            This application installs separately from v2.0 to protect older user data.
            Client registered to Firebase project hasibati-m. For live chat, enable Anonymous Authentication and Firestore and publish the project security rules. This APK does not itself enable server-side services.
          prerelease: true
          make_latest: false
          files: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
