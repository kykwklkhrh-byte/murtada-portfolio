name: Secret Vault Android APK
on:
  push:
    branches: [secret-vault-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: secret_vault_app
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract version 2.1 source
        working-directory: .
        run: |
          mkdir -p secret_vault_app
          base64 --decode secret-vault-bundle.b64 > /tmp/vault.zip
          unzip -q /tmp/vault.zip -d secret_vault_app
      - name: Generate native Android and distinctive app icon
        run: |
          cp pubspec.yaml /tmp/vault-pubspec.yaml
          cp -r lib /tmp/vault-lib
          flutter create --platforms=android --org com.mortadaa --project-name secret_vault .
          cp /tmp/vault-pubspec.yaml pubspec.yaml
          cp /tmp/vault-lib/*.dart lib/
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          data = manifest.read_text().replace('android:label="secret_vault"', 'android:label="حاسبتي M"')
          data = data.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          manifest.write_text(data)
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          content = content.replace('applicationId = "com.mortadaa.secret_vault"', 'applicationId = "com.mortadaa.secret_vault_v21"')
          gradle.write_text(content)
          for source in Path('assets/android_icons').glob('mipmap-*/ic_launcher.png'):
              dest = Path('android/app/src/main/res') / source.parent.name / 'ic_launcher.png'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(source.read_bytes())
          print('Custom launcher icon installed in all Android density folders')
          PY
          grep -q 'secret_vault_v21' android/app/build.gradle.kts
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze sources
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build installable APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          if [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_APP_ID" && -n "$FIREBASE_SENDER_ID" && -n "$FIREBASE_PROJECT_ID" ]]; then
            echo "FIREBASE_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-vault-v2-1-apk
          path: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish publicly downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: secret-vault-v2-1
          target_commitish: secret-vault-v2
          name: "حاسبتي M – v2.1"
          body: |
            Custom calculator icon and Android vault storage fix.
            This application installs separately from v2.0 to protect older user data.
            Chat needs a user-owned Firebase project configured in GitHub Actions secrets.
          prerelease: true
          make_latest: false
          files: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
