name: Secret Vault Android APK
on:
  push:
    branches: [secret-vault-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: secret_vault_app
    steps:
      - name: Checkout private development branch
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter sources
        working-directory: .
        run: |
          mkdir -p secret_vault_app
          base64 --decode secret-vault-bundle.b64 > /tmp/vault.zip
          unzip -q /tmp/vault.zip -d secret_vault_app

      - name: Generate Android platform
        run: |
          cp pubspec.yaml /tmp/vault-pubspec.yaml
          cp -r lib /tmp/vault-lib
          flutter create --platforms=android --org com.mortadaa --project-name secret_vault .
          cp /tmp/vault-pubspec.yaml pubspec.yaml
          cp /tmp/vault-lib/*.dart lib/
          sed -i "s/height: side.clamp(52.0, 90.0),/height: side.clamp(52.0, 90.0).toDouble(),/" lib/main.dart
          sed -i 's/flutter_secure_storage: \^10.0.0/flutter_secure_storage: ^11.2.0/' pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          data = manifest.read_text()
          data = data.replace('android:label="secret_vault"', 'android:label="الحاسبة"')
          data = data.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          manifest.write_text(data)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              gradle.write_text(gradle.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24'))
          PY

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze sources
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build installable APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          if [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_APP_ID" && -n "$FIREBASE_SENDER_ID" && -n "$FIREBASE_PROJECT_ID" ]]; then
            echo "FIREBASE_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: secret-vault-apk
          path: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish downloadable release when Firebase is configured
        if: ${{ env.FIREBASE_READY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: secret-vault-v2
          target_commitish: secret-vault-v2
          name: "Secret Vault v2 – Firebase enabled"
          prerelease: true
          make_latest: false
          files: secret_vault_app/build/app/outputs/flutter-apk/app-release.apk
