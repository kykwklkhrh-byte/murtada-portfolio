name: murtada_star
description: تطبيق مرتضى ستار للعناية الآمنة بالجهاز وتشخيص الإنترنت.
publish_to: none
version: 4.0.0+4

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.0
  disk_space_plus: 0.2.6
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  crypto: ^3.0.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
